name: Bambu · prueba de relleno (rama de pruebas)
on:
  push:
    branches: [bambu-descubrir]
    paths: [".github/workflows/bambu-descubrir.yml", "automatizacion/*.mjs"]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Traer de ChartInspect desde el 5-sep-2026
        env:
          CHARTINSPECT_API_KEY: ${{ secrets.CHARTINSPECT_API_KEY }}
        run: node automatizacion/traer-chartinspect.mjs "$RUNNER_TEMP/datos.json" 2026-09-05
      - name: Rellenar desde el 7-sep-2026 y añadir días nuevos
        run: node automatizacion/bambu-datos.mjs "$RUNNER_TEMP/datos.json" --rellenar 2026-09-07 | tee automatizacion/prueba-relleno.txt
      - name: Comprobar que los archivos cargan
        run: |
          node -e '
            const vm = require("vm"), fs = require("fs");
            for (const f of ["app/btc_real.js", "app/eth_real.js"]) {
              const c = { window: {} }; vm.runInNewContext(fs.readFileSync(f, "utf8"), c);
              const D = Object.values(c.window.BambuRealData)[0];
              for (const k of D.fields) if (D.cols[k].length !== D.dates.length) throw new Error(f + ": " + k + " no cuadra");
              console.log(f, D.count, "días hasta", D.latestIso);
            }
            const c = { window: {} }; vm.runInNewContext(fs.readFileSync("bambu2/data.js", "utf8"), c);
            console.log("bambu2/data.js hasta", c.window.BAMBU2_DATA.BTC.d.at(-1));'
      - name: Guardar el resultado en esta rama
        run: |
          git config user.name "bambu-bot"
          git config user.email "bambu-bot@users.noreply.github.com"
          git add app/btc_real.js app/eth_real.js app/history.js bambu2/data.js automatizacion/prueba-relleno.txt
          git commit -m "prueba: relleno de datos parados desde el 9-sep" || echo "sin cambios"
          git push
