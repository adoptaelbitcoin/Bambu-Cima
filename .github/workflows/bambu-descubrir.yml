name: Bambu · verificar mapeo ChartInspect
on:
  push:
    branches: [bambu-descubrir]
    paths: [".github/workflows/bambu-descubrir.yml", "automatizacion/*.mjs"]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Probar métricas de exchanges y otras paradas desde septiembre
        env:
          CHARTINSPECT_API_KEY: ${{ secrets.CHARTINSPECT_API_KEY }}
        run: node automatizacion/probar-exchanges.mjs automatizacion/prueba-exchanges.txt
      - name: Guardar el informe en esta rama
        if: always()
        run: |
          git config user.name "bambu-bot"
          git config user.email "bambu-bot@users.noreply.github.com"
          git add automatizacion/prueba-exchanges.txt || true
          git commit -m "informe de prueba de exchanges ChartInspect" || echo "sin cambios"
          git push
